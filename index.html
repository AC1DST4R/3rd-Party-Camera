function setStatus(text) {

async function startCamera() {

  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus("Camera/microphone API unavailable");
    return;
  }

  try {

    /*
     * Request BOTH camera and microphone.
     *
     * The browser/device must approve this request.
     */
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          ideal: "environment"
        }
      },
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });

    preview.srcObject = stream;

    await preview.play();

    setStatus("Camera and microphone ready");

  } catch (err) {

    console.error(err);

    switch (err.name) {

      case "NotAllowedError":
        setStatus("Camera/microphone permission denied");
        break;

      case "NotFoundError":
        setStatus("Camera or microphone not found");
        break;

      case "NotReadableError":
        setStatus("Camera/microphone is busy");
        break;

      case "SecurityError":
        setStatus("Access blocked by security policy");
        break;

      case "OverconstrainedError":
        setStatus("Requested device configuration unavailable");
        break;

      default:
        setStatus("Unable to access camera/microphone");
    }
  }
}
